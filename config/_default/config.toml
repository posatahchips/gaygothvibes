baseURL = "https://example.org/"
languageCode = "en-us"
title = "gay goth vibes dot online"
theme = "hugo-arcana"
copyright = "© Untitled. All rights reserved"

defaultContentLanguage = "en"

capitalizeListTitles = false
pluralizeListTitles = false

[markup.goldmark.renderer]
  unsafe = true # Allow HTML in md files

[taxonomies]
    tag = "tags"
    category = "category"

[params]
    description = "gay goth vibes dot online."
    images = ['images/metaimage.jpg']
    show_post_dates = true

    [[params.social]]
        title = "bluesky"
        icon = "fa-bluesky"
        url = "https://bsky.app/profile/posatahchips.gaygothvibes.online"
    [[params.social]]
        title = "instagram"
        icon = "fa-instagram"
        url = "https://www.instagram.com/posatahchips/"


    [params.footer]
        [params.footer.contact_form]
            enabled = false
            header = "contact"
            action = ""

[caches]
  [caches.images]
    dir = ':cacheDir/images'